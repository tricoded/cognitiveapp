name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: |
          pip install -r requirements-data.txt
          pip install fastapi sqlalchemy httpx
      - name: Unit + Spark feature tests
        # test_user_patterns.py is excluded until its stale expectations are fixed
        run: pytest -q tests --ignore=tests/test_user_patterns.py

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-data.txt
      - name: Simulate -> Spark warehouse -> DQ
        run: |
          make data USERS=300 DAYS=30
          make pipeline | tee pipeline.log
          grep -q "injected defects caught: 5/5" pipeline.log
